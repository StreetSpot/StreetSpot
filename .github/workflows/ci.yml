name: StreetSpot CI

on:
  push:
    branches:
      - main
      - rebrand/streetspot-hustle-refresh
      - fix/supabase-least-privilege-grants
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: streetspot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STREETSPOT_AGENT_ACCESS_PASSWORD: ci-only-password-not-for-production-12345
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration history and least-privilege grants
        run: pnpm run check:migration-grants
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build production app
        run: pnpm run build
      - name: Smoke-test protected agent routes
        shell: bash
        env:
          STREETSPOT_AGENT_ACCESS_PASSWORD: ci-only-password-not-for-production-12345
          STREETSPOT_SMOKE_BASE_URL: http://127.0.0.1:3100
        run: |
          pnpm start -- --hostname 127.0.0.1 --port 3100 > /tmp/streetspot-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/agents/login > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:3100/agents/login > /dev/null
          pnpm run smoke:auth
